<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Système solaire en 3D</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="scene-container"></div>

    <header id="masthead">
      <p class="eyebrow">Simulation 3D</p>
      <h1>Système solaire</h1>
    </header>

    <div id="ui-panel">
      <p class="eyebrow">Commande du temps</p>
      <div class="control-row">
        <label for="speed-slider">Vitesse — <span id="speed-value">5</span> j. simulés / s</label>
        <input type="range" id="speed-slider" />
      </div>
      <button id="pause-toggle" type="button">
        <span id="pause-icon" aria-hidden="true">&#10073;&#10073;</span>
        <span id="pause-label">Pause</span>
      </button>
    </div>

    <aside id="info-panel" class="hidden"></aside>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
